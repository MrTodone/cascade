name: npm-publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.4.0"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${{ github.event.inputs.tag }}
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'cascade-npm-*.tgz' --dir .
          VER="${TAG#v}"
          TGZ="cascade-npm-v${VER}.tgz"
          if npm view "@mrtodone/cascade@${VER}" version >/dev/null 2>&1; then
            echo "already published"
            exit 0
          fi
          npm publish "./${TGZ}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
