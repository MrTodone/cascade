name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: npx tsc --noEmit
      - name: vite build (frontend smoke)
        run: npx vite build

  windows:
    name: build-windows-zip
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: build dashboard
        run: npx vite build
      - name: build distribution zip
        run: node scripts/dist-windows.mjs
        env:
          CASCADE_DIST_DIR: ${{ runner.temp }}/cascade-dist
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cascade-windows-x64
          path: |
            ${{ runner.temp }}/cascade-dist/**
      - name: tag release artifact (pass to release job)
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: |
            ${{ runner.temp }}/cascade-dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cascade-windows-x64
          path: dist-artifact
      - name: locate zip
        id: locate
        shell: bash
        run: |
          zip=$(find dist-artifact -name 'cascade-*.zip' | head -1)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "SHA256SUMS=$git" >> /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: meta
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cascade ${{ github.ref_name }}
          body: |
            Windows distribution (two-file layout): cascade.exe + cascade-router.exe,
            bundled sing-box v1.14.1, dashboard, catalog, configs, SHA256SUMS.
          files: |
            dist-artifact/**/*.zip
            meta/SHA256SUMS
          fail_on_unmatched_files: true